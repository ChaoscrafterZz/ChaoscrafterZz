name: Contribution snake

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/snake.yml
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

concurrency:
  group: contribution-snake

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Render light and dark contribution snakes
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#18181b&color_dots=#f4f4f5,#d4d4d8,#a1a1aa,#71717a,#3f3f46
            dist/snake-dark.svg?color_snake=#fafafa&color_dots=#18181b,#3f3f46,#52525b,#71717a,#a1a1aa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
