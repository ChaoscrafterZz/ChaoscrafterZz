<svg xmlns="http://www.w3.org/2000/svg" width="960" height="230" viewBox="0 0 960 230" role="img" aria-labelledby="title desc">
  <title id="title">ChaoscrafterZz — Full-stack development</title>
  <desc id="desc">A minimal profile card with an animated activity line.</desc>
  <style>
    .card { fill: #fff; stroke: #e4e4e7; }
    .name { fill: #18181b; }
    .muted { fill: #52525b; }
    .divider, .track { stroke: #e4e4e7; }
    .pulse { stroke: #52525b; animation: scan 5s ease-in-out infinite; }
    @keyframes scan {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(104px); }
    }
    @media (prefers-color-scheme: dark) {
      .card { fill: #09090b; stroke: #27272a; }
      .name { fill: #fafafa; }
      .muted { fill: #a1a1aa; }
      .divider, .track { stroke: #27272a; }
      .pulse { stroke: #a1a1aa; }
    }
    @media (prefers-reduced-motion: reduce) {
      .pulse { animation: none; }
    }
  </style>
  <rect class="card" x="1" y="1" width="958" height="228" rx="16" stroke-width="2"/>
  <path class="divider" d="M1 155h958"/>
  <g font-family="system-ui, Segoe UI, sans-serif">
    <text class="name" x="40" y="75" font-size="48" font-weight="650" letter-spacing="-2">ChaoscrafterZz</text>
    <text class="muted" x="42" y="115" font-size="22">Full-stack development</text>
    <text class="muted" x="42" y="199" font-size="19">Web apps · Community tools · Minecraft mods</text>
  </g>
  <g fill="none" stroke-width="3" stroke-linecap="round">
    <path class="track" d="M755 192h162"/>
    <path class="pulse" d="M755 192h58"/>
  </g>
</svg>
