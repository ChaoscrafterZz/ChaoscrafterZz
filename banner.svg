    <text x="49" y="144" fill="#f8f3ff" font-family="system-ui, Segoe UI, sans-serif" font-size="63" font-weight="750">ChaoscrafterZz</text>
    <text x="53" y="184" fill="#d4cbe6" font-family="system-ui, Segoe UI, sans-serif" font-size="25">From interface to runtime.</text>
    <rect x="53" y="205" width="105" height="3" rx="1.5" fill="url(#accent)"/>
